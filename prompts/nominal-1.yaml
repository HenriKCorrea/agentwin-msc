model: gpt-4o

# Scenario: Nominal
# Platform state: transformer headroom sufficient to accommodate the full fleet.
# Expected outcome: all 17 vehicles assigned; unresolvable_vehicles empty; oversubscription null.
# Gap exercised:
#   - Conceptual: agent must correlate EVChargingStation (SC) to CustomerLoad zone (EG)
#     by geographic proximity — no shared identifier exists between platforms.
#   - Structural: agent must reconcile GeoJSON WGS84 coordinates (SC) with CIM PositionPoints
#     under an OGC URN coordinate reference system (EG) to determine zone membership.
#   - Vocabulary: agent must infer VehicleType from model name (e.g. "Mack LR Electric" → truck)
#     to filter stations by allowedVehicleType — neither ontology models this mapping.

messages:
  - role: system
    content: |
      You are AgenTwin, a fleet charging coordinator agent.

      You have access to two data platforms:
      - Smart City DT (DCAS): contains EVChargingStation records with location, status,
        available capacity, and allowed vehicle types.
      - Energy Grid DT (ConEdison): contains ElectricVehicle records, CustomerLoad and
        EquivalentLoad records per substation zone, and PowerTransformer rated capacity.

      Your task is to produce a complete overnight charging assignment for the submitted fleet.

      When you have determined the full assignment, call submit_assignment exactly once.
      Do not call it until you have resolved every vehicle in the request.

  - role: user
    content: |
      I need to schedule tonight's depot charge.
      Incoming vehicles:
      8 Chevrolet Bolt EVs (NYPD),
      4 Hyundai Ioniq 5s (FDNY EMS),
      2 Thomas Built Jouley school buses (DOE),
      1 eSprinter mobile command unit (NYCEM) and
      2 Mack LR Electric collection trucks (DSNY).
      Which stations can charge all of them without exceeding grid limits?

tools:
  - type: function
    function:
      name: submit_assignment
      description: >
        Formally commit the fleet charging assignment produced by multi-agent negotiation.
        This tool terminates the session and delivers the structured result to the operator.
        Call exactly once when all vehicles in the request have been resolved.
      parameters:
        type: object
        required: [assignments, unresolvable_vehicles, oversubscription]
        properties:

          assignments:
            type: array
            description: One entry per vehicle successfully assigned to a charging station.
            items:
              type: object
              required: [vehicle_id, station_id, zone_id]
              properties:
                vehicle_id:
                  type: string
                  description: ElectricVehicle entity ID from Energy Grid DT.
                  # Assertion: vehicle_id must exist in Ditto; chargeRateMax retrieved from it.
                station_id:
                  type: string
                  description: EVChargingStation entity ID from Smart City DT.
                  # Assertion: station allowedVehicleType must include the vehicle's inferred type (Vocabulary gap).
                zone_id:
                  type: string
                  description: Substation entity ID from Energy Grid DT that serves this station.
                  # Assertion: station WGS84 coordinates must fall within zone boundary (Conceptual + Structural gap).

          unresolvable_vehicles:
            type: array
            description: Vehicles that could not be assigned. Must be empty in the nominal scenario.
            items:
              type: object
              required: [vehicle_id, reason]
              properties:
                vehicle_id:
                  type: string
                reason:
                  type: string
                  enum:
                    - type_inference_failed
                    - no_compatible_station
                    - no_capacity

          oversubscription:
            description: >
              Populated when transformer headroom is insufficient to accommodate the full fleet.
              Null in the nominal scenario.
            oneOf:
              - type: "null"
              - type: object
                required: [zone_id, demand_kw, headroom_kw]
                properties:
                  zone_id:
                    type: string
                  demand_kw:
                    type: number
                  headroom_kw:
                    type: number
